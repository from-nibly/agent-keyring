[package]
name = "agent-keyring"
version = "0.1.1"
edition = "2024"
rust-version = "1.85"
description = "Administrator-approved, process-scoped secrets for coding agents on Linux"
license = "MIT"
repository = "https://github.com/from-nibly/agent-keyring"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
